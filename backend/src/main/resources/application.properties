spring.application.name=vyapaarai-backend
server.port=8081

# Database Configuration (Defaults to H2 in-memory MySQL mode; configurable via env vars for real MySQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:vyapaaraidb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging Configuration
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=WARN

# LLM Provider Configuration (Google Gemini REST API)
llm.api.key=${LLM_API_KEY:}
llm.model=${LLM_MODEL:gemini-1.5-flash}


